services:
  - type: web
    name: visionai
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn --workers 1 --threads 1 --timeout 180 --max-requests 25 --max-requests-jitter 5 image_recognition.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: TF_NUM_INTRAOP_THREADS
        value: "1"
      - key: TF_NUM_INTEROP_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: TF_ENABLE_ONEDNN_OPTS
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: visionai-db
          property: connectionString

databases:
  - name: visionai-db
    plan: free