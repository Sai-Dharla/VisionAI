{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In - VisionAi</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-[#F4F6FB] text-slate-800 antialiased min-h-screen flex items-center justify-center p-4">
<main class="w-full max-w-md">
  <div class="text-center mb-8"><a href="{% url 'recognition:recognize' %}" class="inline-flex items-center gap-3"><div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-white shadow-lg"><svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="4"/><path d="M3 9a2 2 0 0 1 2-2h3l2-3h4l2 3h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9z"/></svg></div><div class="text-left"><h1 class="text-2xl font-bold text-slate-900">Vision<span class="text-blue-600">Ai</span></h1><p class="text-[11px] text-slate-400 tracking-wide">Image Recognition</p></div></a></div>
  <section class="bg-white rounded-3xl p-8 shadow-sm border border-slate-200/80">
    <div class="text-center space-y-2 mb-6"><h2 class="text-2xl font-extrabold text-slate-900">Welcome Back</h2><p class="text-sm text-slate-500">Sign in to access your saved scans and account.</p></div>
    {% if error %}<div class="bg-rose-50 border border-rose-200 text-rose-700 p-3.5 rounded-xl text-xs font-semibold mb-4">{{ error }}</div>{% endif %}
    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div class="space-y-1"><label for="email" class="text-xs font-bold text-slate-700">Email Address</label><input id="email" name="email" type="email" required autocomplete="email" value="{{ request.POST.email|default:'' }}" placeholder="you@example.com" class="w-full bg-[#F4F6FB] border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/40 focus:border-blue-500"></div>
      <div class="space-y-1"><label for="password" class="text-xs font-bold text-slate-700">Password</label><input id="password" name="password" type="password" required autocomplete="current-password" placeholder="Enter your password" class="w-full bg-[#F4F6FB] border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/40 focus:border-blue-500"></div>
      <button type="submit" class="w-full py-3 bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold text-sm rounded-xl shadow-md shadow-blue-500/20">Sign In</button>
    </form>
    <p class="mt-6 text-center text-xs text-slate-500">Don't have an account? <a href="{% url 'recognition:register' %}" class="font-bold text-blue-600 hover:underline">Sign Up</a></p>
  </section>
</main>
</body>
</html>
