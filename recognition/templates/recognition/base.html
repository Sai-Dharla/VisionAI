{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Image Recognition{% endblock %}</title>
    <link href="{% static 'css/tailwind.css' %}" rel="stylesheet">
    <script src="{% static 'js/theme.js' %}"></script>
</head>
<body class="h-full bg-gray-100 dark:bg-gray-900">
    <!-- Header -->
    <header class="flex items-center justify-between p-4 bg-white dark:bg-gray-800 shadow">
        <h1 class="text-2xl font-bold">Image Recognition</h1>
        <!-- Auth widget -->
        <div id="auth-widget" class="flex items-center space-x-4">
            {% if user.is_authenticated %}
                <span>Hi, {{ user.username }}</span>
                <a href="{% url 'recognition:logout' %}" class="text-blue-600 dark:text-blue-400">Logout</a>
            {% else %}
                <a href="{% url 'recognition:login' %}" class="text-blue-600 dark:text-blue-400">Login</a>
            {% endif %}
            <!-- Dark‑mode toggle -->
            <button id="theme-toggle" onclick="toggleTheme()" class="p-2">
                <svg id="theme-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1.5M12 19.5V21M4.219 4.219l1.061 1.061M17.72 17.72l1.061 1.061M3 12h1.5M19.5 12H21M4.219 19.781l1.061-1.061M17.72 6.28l1.061-1.061" />
                    <circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="1.5" fill="none" />
                </svg>
            </button>
        </div>
    </header>

    <div class="flex h-[calc(100%-4rem)]">
        <!-- Sidebar navigation -->
        <nav class="w-64 bg-white dark:bg-gray-800 p-4">
            <ul class="space-y-2">
                <li><a href="{% url 'recognition:recognize' %}" class="nav-link">Recognize</a></li>
                <li><a href="{% url 'recognition:history' %}" class="nav-link">History</a></li>
                <li><a href="{% url 'recognition:explore' %}" class="nav-link">Explore</a></li>
                <li><a href="{% url 'recognition:modelinfo' %}" class="nav-link">Model Info</a></li>
                <li><a href="{% url 'recognition:settings' %}" class="nav-link">Settings</a></li>
            </ul>
        </nav>

        <!-- Main content -->
        <main class="flex-1 p-6 overflow-auto">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script src="{% static 'js/nav.js' %}"></script>
</body>
</html>
